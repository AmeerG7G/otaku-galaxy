# ==============================================================================
# تشغيل خادم مجرّة الأوتاكو بالحاويات — للاختبار المسبق والإنتاج.
#
# الملف واحد للبيئتين، لكن **كل بيئة في نسخة مستودعٍ خاصة بها وباسم مشروعٍ
# خاص بها** (انظر `deploy/README.md` §٢):
#
#   cd /srv/otaku-galaxy-staging && ENV_FILE=./backend/.env.staging HOST_PORT=4001 \
#     IMAGE_TAG=staging-<commit> docker compose -p otaku-staging up -d api
#   cd /srv/otaku-galaxy        && ENV_FILE=./backend/.env.prod    HOST_PORT=4000 \
#     IMAGE_TAG=prod-<commit>    docker compose -p otaku-prod    up -d api
#
# [CRITICAL] لا قيمة افتراضية لـ`ENV_FILE` ولا `HOST_PORT` ولا `IMAGE_TAG`:
# غياب أيٍّ منها يوقف compose برسالة بدل أن يخلط البيئتين. كانت الافتراضات
# (`.env.staging` + المنفذ 4000 + الوسم `latest`) تجعل أمراً عارياً يشغّل
# الاختبار المسبق على منفذ الإنتاج، وبناءَ الاختبار المسبق يعيد وسم الصورة
# التي يُعاد منها إنشاء حاوية الإنتاج. والمشروع نفسه (المجلّد نفسه بلا `-p`)
# يعني حاويةً واحدة وحجم صورٍ واحداً للبيئتين: كل `up` يستبدل الأخرى.
#
# [CRITICAL] لا سرّ في هذا الملف ولا في الصورة. ملفات `.env.*` الحقيقية
# تُنشأ على الخادم ولا تدخل Git إطلاقاً (انظر `.gitignore`).
#
# قاعدة البيانات ليست خدمةً هنا في الاستعمال الحقيقي: `DATABASE_URL` يشير
# إلى قاعدة مُدارة أو إلى خادم قاعدة منفصل له نسخه الاحتياطية ودورة صيانته.
# قاعدةٌ داخل نفس ملف التشغيل تعني أن حذف المكدّس يحذف بيانات الزبائن.
# ==============================================================================

services:
  api:
    build:
      context: ./backend
      target: runtime
      args:
        NODE_VERSION: "22"
    image: otaku-galaxy-api:${IMAGE_TAG:?IMAGE_TAG مطلوب — وسمٌ خاص بالبيئة والإصدار، مثل staging-<commit> أو prod-<commit>}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ملف البيئة يحمل كل شيء: APP_ENV، الأسرار، وصلة القاعدة، إعداد الرسائل.
    # غيابه يعني إقلاعاً بلا إعداد — وهو ما ترفضه طبقة الإعدادات صراحةً.
    env_file:
      - ${ENV_FILE:?ENV_FILE مطلوب — ./backend/.env.staging أو ./backend/.env.prod}
    environment:
      # [CRITICAL] المنفذ **داخل** الحاوية ثابت على 4000، ويطغى هذا على أي
      # `PORT` في ملف البيئة (`environment` أعلى أولويةً من `env_file`).
      #
      # الخلط بين المنفذين عطلٌ صامت: ملف الاختبار المسبق يضبط `PORT=4001`
      # ليتعايش مع الإنتاج على خادم **بلا حاويات**، لكن الحاوية معزولة
      # شبكياً فلا معنى لتمييز منفذها الداخلي. لولا هذا السطر لاستمع
      # التطبيق على 4001 بينما يوجّه compose إلى 4000 ويفحص 4000 — فتصير
      # الخدمة غير قابلة للوصول و«غير صحّية» دائماً بلا رسالة خطأ واحدة.
      #
      # التمييز بين البيئتين يقع على منفذ **المضيف** عبر `HOST_PORT`.
      PORT: "4000"
      # العطل نفسه للعنوان: `HOST=127.0.0.1` في ملف البيئة (صحيحٌ خارج الحاويات)
      # يربط واجهة الحاوية المحلية، فلا يصلها المنفذ المنشور بينما فحص الصحّة
      # من داخلها ينجح. الحماية هنا في `ports` (واجهة المضيف المحلية)، لا في HOST.
      HOST: "0.0.0.0"
    ports:
      # يُنشر على الواجهة المحلية فقط: nginx وحده يواجه الإنترنت، والحاوية
      # لا يجوز أن تكون قابلة للوصول مباشرةً من الخارج متجاوزةً TLS وحدوده.
      - "127.0.0.1:${HOST_PORT:?HOST_PORT مطلوب — 4001 للاختبار المسبق، 4000 للإنتاج}:4000"
    volumes:
      # الصور المرفوعة يجب أن تعيش خارج الحاوية، وإلا ضاعت مع كل نشر.
      - uploads:/app/uploads
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      # سجلّ بلا سقف يملأ القرص ويوقف الخادم — العطل الذي يبدو بلا سبب.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # الهجرات — تُشغَّل يدوياً قبل تشغيل نسخة جديدة، لا تلقائياً مع كل إقلاع.
  #
  # الهجرة التلقائية عند الإقلاع تعني أن كل نسخة تحاول الهجرة معاً، وأن
  # فشلها يمنع الخادم من العمل حتى لو كان العطل في هجرة لا تخصّ الطلبات
  # الجارية. هنا خطوةٌ صريحة يقرّرها المشغّل ويقرأ مخرجاتها.
  #
  # تعمل من مرحلة `builder` لأن `scripts/migrate.ts` خارج `rootDir` فلا
  # يترجمه `tsc`، ويحتاج `tsx` وهي أداة تطوير لا مكان لها في صورة الإنتاج.
  #
  #   docker compose -p otaku-staging --profile tools run --rm migrate
  #   (المتغيّرات الثلاثة مطلوبة هنا أيضاً: compose يفسّر الملف كله — انظر §٢)
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["tools"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./backend
      target: builder
      args:
        NODE_VERSION: "22"
    env_file:
      - ${ENV_FILE:?ENV_FILE مطلوب — ./backend/.env.staging أو ./backend/.env.prod}
    command: ["npx", "tsx", "scripts/migrate.ts"]
    restart: "no"

volumes:
  uploads:
