# كان هذا مضبوطاً على 8G — أكبر من ذاكرة الجهاز الفعلية (7.6G)، ما كان
# يمنع Kotlin daemon من الحصول على ذاكرة كافية لبدء التشغيل أصلاً
# (سجلّه فارغ تماماً — لم يبدأ حتى). قيمة واقعية لجهاز بهذا الحجم:
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvm.options=-Xmx1536m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
