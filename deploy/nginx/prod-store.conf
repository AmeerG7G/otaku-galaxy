# ==============================================================================
# nginx — المتجر العام للإنتاج: otakugalaxystore.com
#
# الاسم المعتمد الوحيد (قرار المالك، 2026-11-02): `www.otakugalaxystore.com` خارج
# نطاق الإطلاق — لا سجلّ DNS ولا شهادة ولا تحويل له هنا.
#
# عكس الاختبار المسبق تماماً في نقطتين مقصودتين: **لا Basic Auth** و**لا
# noindex** — المتجر عامّ ويُفهرس. كل ما عدا ذلك كما في `staging-store.conf`.
#
# الموقع (Next.js) يثق بـ`X-Real-IP` لأن nginx وحده يصله (127.0.0.1:3000)،
# ويضع سياسة المحتوى (CSP) بنفسه؛ nginx لا يكرّرها.
# ==============================================================================

# ---------- HTTP: تحويل إلى HTTPS + تحدّي ACME ----------
server {
    listen 80;
    listen [::]:80;
    server_name otakugalaxystore.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name otakugalaxystore.com;

    ssl_certificate     /etc/letsencrypt/live/otakugalaxystore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otakugalaxystore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # بلا includeSubDomains: النطاقات الفرعية لها ترويستها الخاصة، والتزامٌ
    # سنةً كاملة لكل اسمٍ تحت النطاق قرارٌ لا يُتّخذ ضمناً هنا.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # المتجر لا يستقبل رفعاً — نماذج الحساب والطلب وحدها.
    client_max_body_size 1m;
    client_body_timeout 30s;

    access_log /var/log/nginx/prod-store.access.log;
    error_log  /var/log/nginx/prod-store.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # رؤوس لا يحقّ للعميل تمريرها إلى الموقع.
        proxy_set_header Authorization     "";
        proxy_set_header CF-Connecting-IP  "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
    }
}
