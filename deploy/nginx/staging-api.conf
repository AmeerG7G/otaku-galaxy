# ==============================================================================
# nginx — واجهة الاختبار المسبق: staging-api.example.com
#
# النطاق قيمة نائبة عمداً؛ يُستبدل عند شراء النطاق. لا شيء في الشيفرة يعتمد
# عليه: التطبيق يقرأ عنوانه من `PUBLIC_BASE_URL` ولوحة التحكم من إعداد
# البناء، فتغييره هنا وفي ملف البيئة يكفي.
#
# [CRITICAL] هذا الملف هو ما يجعل `TRUST_PROXY=1` صحيحاً. الخادم خلفه يقرأ
# `X-Forwarded-For` ليعرف عنوان الزبون الحقيقي؛ بدون تمرير الرؤوس أدناه ترى
# كل الطلبات قادمةً من 127.0.0.1، فينهار حدّ المعدّل إلى دلو واحد مشترك
# ويُقفل التسجيل والدخول على الجميع بعد أول عشرة طلبات.
# ==============================================================================

# منفذ مختلف عن الإنتاج (4000) كي تتعايش البيئتان على خادم واحد إن لزم.
# يقابله `HOST_PORT=4001` في docker compose أو `PORT=4001` في `.env.staging`.
upstream otaku_staging_api {
    server 127.0.0.1:4001;
    keepalive 32;
}

# ---------- HTTP: تحويل إلى HTTPS + تحدّي ACME ----------
server {
    listen 80;
    listen [::]:80;
    server_name staging-api.example.com;

    # certbot يضع تحدّيه هنا؛ يجب أن يبقى على HTTP وإلا تعذّر التجديد.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging-api.example.com;

    # تُنشئها certbot؛ المسارات هي مسارات Let's Encrypt المعتادة.
    ssl_certificate     /etc/letsencrypt/live/staging-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS على الاختبار المسبق بمدة قصيرة: يثبت أن الإعداد يعمل قبل أن
    # يُلتزم به سنةً كاملة على الإنتاج. المتصفح يتذكّره، فالمبالغة هنا تعني
    # قفل نطاقٍ تجريبي على HTTPS مدةً طويلة بلا حاجة.
    add_header Strict-Transport-Security "max-age=86400" always;

    # الرؤوس الأمنية الأخرى يضعها helmet في التطبيق؛ لا نكرّرها هنا كي لا
    # يوجد مصدران للحقيقة يتباعدان.

    # حجم الجسم: سقف الرفع في التطبيق ٥ ميغابايت (`UPLOADS_MAX_BYTES`).
    # نترك هامشاً للترميز متعدّد الأجزاء، ونبقي الرقم أقرب ما يمكن من سقف
    # التطبيق كي يُرفض الملف الضخم عند الحافة لا بعد أن يعبر الشبكة كاملاً.
    client_max_body_size 8m;
    client_body_timeout 60s;

    # سجلّ منفصل لكل بيئة — خلطُهما يجعل تشخيص عطلٍ في الإنتاج بحثاً في ضجيج.
    access_log /var/log/nginx/staging-api.access.log;
    error_log  /var/log/nginx/staging-api.error.log warn;

    # فحص الصحّة: بلا تسجيل كي لا يغرق السجلّ بنبضة كل ثلاثين ثانية.
    location = /health {
        access_log off;
        proxy_pass http://otaku_staging_api;
        proxy_set_header Host $host;
    }

    # الصور المرفوعة يخدمها التطبيق من `/uploads` مع ترويسات تخزين طويلة.
    location /uploads/ {
        proxy_pass http://otaku_staging_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://otaku_staging_api;

        # الرؤوس الأربعة التي يعتمد عليها الخادم:
        #   Host              — لبناء الروابط والتحقق من الأصل
        #   X-Real-IP         — عنوان الزبون كما يراه nginx
        #   X-Forwarded-For   — السلسلة كاملة (يقرؤها express مع trust proxy)
        #   X-Forwarded-Proto — كي يعرف التطبيق أن الاتصال مشفَّر رغم أن
        #                        الوصلة الداخلية إلى 127.0.0.1 ليست كذلك
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 + Connection فارغة: شرط إبقاء الاتصال حيّاً نحو upstream،
        # وشرط ترقية WebSocket لو احتيج إليها لاحقاً (لا شيء يستعملها اليوم:
        # الإشعارات تُقرأ بالاستطلاع لا بقناة دائمة).
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # لا تخزين مؤقّت لردود الـAPI: ردٌّ مخزَّن يعني أن زبوناً قد يرى
        # بيانات زبونٍ آخر.
        proxy_buffering off;
    }
}
