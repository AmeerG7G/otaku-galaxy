# ==============================================================================
# عنوان الزائر الحقيقي خلف Cloudflare — يُضمَّن في موقعٍ بعينه، لا في http {}.
#
# يُثبَّت في /etc/nginx/snippets/cloudflare-real-ip.conf ويضمّنه ملف الموقع
# (`staging-store.conf`). بدونه يصير `$remote_addr` عنوانَ Cloudflare لكل زائر،
# فيوقّع الموقع ذلك العنوان للـAPI ويصير كل الزبائن دلوَ حدودٍ واحداً.
#
# [CRITICAL] `CF-Connecting-IP` يُقبل **فقط** من اتصالٍ مصدره نطاقٌ أدناه. من
# يتصل بالخادم مباشرةً (متجاوزاً Cloudflare) ويرسل الترويسة يبقى عنوانه هو.
#
# النطاقات من https://www.cloudflare.com/ips-v4 و/ips-v6 (جُلبت 2026-10-26).
# تتغيّر نادراً؛ يُعاد جلبها ومقارنتها قبل كل تثبيت لهذا الملف.
# ==============================================================================

