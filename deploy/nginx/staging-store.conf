# ==============================================================================
# nginx — الموقع على الاختبار المسبق (staging-store.otakugalaxystore.com).
#
# التثبيت والتفعيل: `docs/staging/staging-store-deploy-plan.md` (الشهادة أولاً،
# ثم هذا الملف، والإعادة مشروطةٌ بنجاح `nginx -t`).
#
# [CRITICAL] موقعٌ مغلق، لا متجرٌ عام. قاعدة الاختبار المسبق قد تحمل حسابات زبائن
# حقيقيين، والموقع يقبل طلبات دفعٍ عند الاستلام: لا يصله إلا من يحمل كلمة مرور
# المختبِرين، ولا تفهرسه محرّكات البحث. لا يُرفع أيٌّ من الحاجزين قبل قرارٍ صريح.
#
# [CRITICAL] `listen … ssl http2` لا `http2 on;`: nginx على الخادم 1.24، و`http2 on`
# يحتاج 1.25.1 (فيُفشل `nginx -t`). عند الترقية يُستبدل السطر ويختفي التحذير.
#
# لا `ssl_stapling`: Let's Encrypt أوقفت OCSP (2025)، فالتدبيس لا يجد ما يدبّسه
# ويملأ السجلّ تحذيرات.
#
# لا HSTS بعد: يُضاف (`max-age=86400` كملف الـAPI) بعد أن يُتحقَّق من HTTPS على
# النطاق — المتصفح يتذكّره ولا تراجع عنه من طرف الخادم.
# ==============================================================================

# HTTP: تحدّي Let's Encrypt (تجديد الشهادة يمرّ من هنا — لا يُحوَّل) ثم HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name staging-store.otakugalaxystore.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-store.otakugalaxystore.com;

    ssl_certificate     /etc/letsencrypt/live/staging-store.otakugalaxystore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-store.otakugalaxystore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # عنوان الزائر الحقيقي قبل أي شيء يقرؤه (السجلّ، والترويستان أدناه).
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # المختبِرون وحدهم. الملف خارج المستودع (لا كلمة مرور في Git)، يملكه root
    # ويقرؤه nginx: انظر خطة النشر.
    auth_basic           "Otaku Galaxy staging";
    auth_basic_user_file /etc/nginx/staging-store.htpasswd;

    # لا فهرسة لأي ردّ، حتى ردود 401 والأخطاء. لا `add_header` داخل أي `location`
    # أدناه: وجوده هناك يُسقط هذا السطر من ذلك الموقع.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # الموقع لا يرفع ملفات؛ أجسام الطلبات JSON صغيرة.
    client_max_body_size 1m;
    client_body_timeout 30s;

    access_log /var/log/nginx/staging-store.access.log;
    error_log  /var/log/nginx/staging-store.error.log warn;

    # يقرؤه الزاحف بلا كلمة مرور، فيعرف أن الموقع كله ممنوع.
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_set_header Host              $host;
        # [CRITICAL] كتابةٌ فوق الترويستين لا إلحاق: الموقع يوقّع ما يصله في
        # `X-Real-IP` عنواناً للزبون، فقيمةٌ يمرّرها المتصفح كانت ستدعه يختار
        # دلو حدوده (`web-store/README.md`). لذلك لا `$proxy_add_x_forwarded_for`.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # كلمة مرور المختبِرين لا تتجاوز nginx إلى التطبيق ولا إلى سجلّاته.
        proxy_set_header Authorization     "";
        # العنوان صار في `$remote_addr`؛ لا مصدرٌ ثانٍ له يصل التطبيق (والترويسة
        # تصل كما هي من اتصالٍ لا يمرّ بـCloudflare).
        proxy_set_header CF-Connecting-IP  "";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # صفحات الموقع تُرسَم لكل طلب وتُبَثّ؛ ولا تخزين لردودٍ تخصّ جلسة زبون.
        proxy_buffering off;
    }
}
