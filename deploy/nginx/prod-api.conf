# ==============================================================================
# nginx — واجهة API الإنتاج: api.otakugalaxystore.com
#
# مبنيّ على إعداد الاختبار المسبق الحيّ بعد إصلاحات R1–R4 (2026-11-01)، لا على
# القالب القديم: Cloudflare أمام الخادم، فعنوان الزبون الحقيقي يأتي من
# `cloudflare-real-ip.conf`، ثم يُمرَّر للتطبيق عنواناً واحداً لا سلسلة.
#
# [CRITICAL] `TRUST_PROXY=1` في `backend/.env.prod` صحيح فقط لأن nginx يضع
# `X-Forwarded-For $remote_addr` (بعد استبدال real_ip). `$proxy_add_x_forwarded_for`
# كان يُلحق عنوان حافة Cloudflare بما يرسله العميل، فيقرأ express قيمةً
# يتحكّم بها المهاجم ويتجاوز حدود المعدّل.
#
# HSTS لا يُضاف هنا: helmet في التطبيق يرسله (`max-age=31536000; includeSubDomains`).
# إضافته هنا كانت ترويستين متعارضتين على الاختبار المسبق (I-03).
# ==============================================================================

# المنفذ 4000 للإنتاج، 4001 للاختبار المسبق — `HOST_PORT` في docker compose.
upstream otaku_prod_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ---------- HTTP: تحويل إلى HTTPS + تحدّي ACME ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.otakugalaxystore.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    # nginx 1.24 على الخادم: `http2` معامل listen لا توجيه مستقل.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.otakugalaxystore.com;

    ssl_certificate     /etc/letsencrypt/live/api.otakugalaxystore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.otakugalaxystore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # الـAPI ليس موقعاً يُتصفَّح: لا فهرسة لأي ردّ، ولا صفحة جذر.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # سقف الرفع في التطبيق ٥ ميغابايت (`UPLOADS_MAX_BYTES`) + هامش الأجزاء.
    client_max_body_size 8m;
    client_body_timeout 60s;

    access_log /var/log/nginx/prod-api.access.log;
    error_log  /var/log/nginx/prod-api.error.log warn;

    location = / {
        return 404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /health {
        access_log off;
        proxy_pass http://otaku_prod_api;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://otaku_prod_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://otaku_prod_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        # لا تخزين مؤقّت لردود الـAPI: ردٌّ مخزَّن قد يُري زبوناً بيانات غيره.
        proxy_buffering off;
    }
}
