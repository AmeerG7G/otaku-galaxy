# ==============================================================================
# nginx — لوحة التحكم للإنتاج: admin.otakugalaxystore.com
#
# ملفات ثابتة (React/Vite، `vite build --mode prod`). الحماية الحقيقية في الـAPI:
# كل مسار `/api/admin` يتطلّب رمز مسؤول وصلاحيته (مصفوفة authz). ما هنا دفاعٌ
# إضافي لا بديل:
#   - بوّابة أمام الاسم: Basic Auth بملف كلمات مرور خاص بالإنتاج (قرار المالك
#     2026-11-02؛ Cloudflare Access لم يُختر).
#   - لا فهرسة إطلاقاً: `X-Robots-Tag` على كل ردّ + `robots.txt` يمنع الكل.
#   - اللوحة لا تُضمَّن في إطار، ولا ترسل المُحيل، ولا تتصل إلا بنفسها وبالـAPI.
# ==============================================================================

# ---------- HTTP: تحويل إلى HTTPS + تحدّي ACME ----------
server {
    listen 80;
    listen [::]:80;
    server_name admin.otakugalaxystore.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.otakugalaxystore.com;

    ssl_certificate     /etc/letsencrypt/live/admin.otakugalaxystore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.otakugalaxystore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # الاسم بنقطة في آخره (`admin.otakugalaxystore.com.`) أصلٌ مختلف عند المتصفّح، فـCORS
    # الـAPI يرفضه — وهو محقّ — وتظهر «تعذر الاتصال بالخادم» عند الدخول (2026-11-02).
    # نحوّله إلى الاسم الصحيح قبل البوّابة، ولا نوسّع CORS أبداً.
    if ($http_host ~ "\.(:[0-9]+)?$") {
        return 301 https://admin.otakugalaxystore.com$request_uri;
    }

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # بوّابة Basic Auth أمام اللوحة (قرار المالك 2026-11-02) — ملف كلمات مرور خاص
    # بالإنتاج، لا ملف الاختبار المسبق. `robots.txt` وحده خارجها.
    auth_basic           "Otaku Galaxy admin";
    auth_basic_user_file /etc/nginx/prod-admin.htpasswd;

    # `always` كي تصل الرؤوس مع ردود الخطأ أيضاً. أي `add_header` داخل location
    # يُلغي هذه كلها هناك، فلا location أدناه يضيف رأساً.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # script-src: ملفات اللوحة + السكربت المضمَّن الوحيد في `admin/index.html`
    #   (منع وميض السمة) ببصمته. تغييره يغيّر البصمة — اختبار env-templates يطابقهما.
    # connect-src: الـAPI + Firebase (إشعارات المسؤول على الويب، STEP 64) إن فُعّلت.
    # img-src: صور المنتجات من `/uploads` على مضيف الـAPI.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-JodtxyE0ojboHRYq1XMKh2EfELRCPVp01OTKJrGSMTo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.otakugalaxystore.com; font-src 'self' data:; connect-src 'self' https://api.otakugalaxystore.com https://*.googleapis.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    access_log /var/log/nginx/prod-admin.access.log;
    error_log  /var/log/nginx/prod-admin.error.log warn;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    root /srv/otaku-galaxy/production/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
