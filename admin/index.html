<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- تثبيت اللوحة على الهاتف — شرط إشعارات الويب على iPhone (iOS 16.4+). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/otaku-square-mark.png" />
    <meta name="theme-color" content="#7C5CFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم مجرة الأوتاكو</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('otaku-galaxy-admin-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
        }
      })();
    </script>
    <style>
      [data-theme="dark"], html.dark {
        color-scheme: dark;
      }
      [data-theme="light"], html:not(.dark) {
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
